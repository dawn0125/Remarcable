<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Makeup Website
      {% endblock %}
    </title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"  rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="#">Beauty Store</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">
            <a class="nav-link" href="{% url 'home' %}">Home</a>
          </li>
        </ul>

        <!-- Right side of nav bar-->
         <!-- Filter -->
         <form method = "GET">
          <!-- Keep search values if searched -->
          {% if searched %} <input type = "hidden" name = "searched" value = "{{searched}}"> {% endif %}
          <!-- Category Filter -->
          <select name = "category" id = "category">
            <span class="text-light mr-2"> Category </span>
            <option value = "">Category</option>
            {% for cat in all_categories %}
              <option value = "{{ cat.pk }}"> {{cat.name}} </option>
            {% endfor %}
          </select>
          <!-- Tag Filter -->
          <span class="text-light mr-2"> Tags </span>
          <select name="tags" id = "tags" size="1" multiple>
            {% for tag in all_tags %}
              <option value = "{{ tag.pk }}"> {{tag.name}} </option>
            {% endfor %}
          </select>
          <button type="submit" class="btn-outline-secondary">Filter</button>
        </form>
        <!-- Search Bar -->
        <form class = "d-flex" method="GET" action="{% url 'search' %}">
          <input type = "search" placeholder="Search" aria-label="Search" name = "searched">
          <!-- This keeps the filter values while you search -->
          {% for key, values in request.GET.lists %}
            {% if key != 'searched' %}
              {% for v in values %}
                <input type = "hidden" name="{{ key }}" value = "{{ v }}">
              {% endfor %}
            {% endif %}
          {% endfor %}
          <button class = "btn-outline-secondary" type = "submit">Search</button>
        </form>
      </div>
    </nav>
    <div class="container">{% block content %} {% endblock %}</div>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
