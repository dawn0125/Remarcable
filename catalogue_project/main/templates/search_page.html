{% extends "base.html" %}

{% block content %}
<center>
    {% if searched %}
    <h1>You searched for <i> {{ searched }} </i></h1>
    {% else %}
    <h1>You did not search for anything</h1>
    {% endif %}
</center>

<u1>
    {% for product in products %}
    <li>
        {{product.name}}, {{product.category.name}}
    </li>
    {% endfor %}
</u1>
{% endblock %}
